name: "Set up Java and Maven"
description: >
  Restores the local Maven repository from the cache without saving it, installs .ci.settings.xml and sets up the JDK.
  The cache is saved by the build job in ci.yml only.
inputs:
  java-version:
    description: the desired Java version
    required: true
outputs:
  cache-primary-key:
    description: the key the build job saves the repository under
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: whether an entry with the exact primary key was restored
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # Same key format as alfresco-build-tools setup-java-build, so existing entries keep restoring.
    - name: "Restore local Maven repository"
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    - name: "Install .ci.settings.xml"
      shell: bash
      run: |
        mkdir -p ~/.m2
        cp .ci.settings.xml ~/.m2/settings.xml
    - name: "Set up Java"
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin
        overwrite-settings: false
