name: Master/Release branch workflow

on:
  push:
    branches:
      - master
      - release/**

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  AWS_REGION: eu-west-1
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  BASE_BUILD_NUMBER: 10000
  # Note: RELEASE_VERSION and DEVELOPMENT_VERSION are now loaded from .github/release-versions.yml

jobs:
  commit_parser:
    name: "Parse commit metadata"
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.get-commit.outputs.COMMIT_MESSAGE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-commit-message@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        id: get-commit
        with:
          header-only: "true"

  run_ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  docker_latest:
    name: "Update latest and Single Pipeline <acs>-<build> images"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [run_ci, commit_parser]
    if: >
      !(failure() || cancelled()) &&
      !contains(needs.commit_parser.outputs.title, '[skip docker_latest]') &&
      github.ref_name == 'master' && github.event_name != 'pull_request'
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          owner: Alfresco
          repositories: alfresco-enterprise-share,alfresco-enterprise-repo,acs-packaging
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: "Build"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          AUTH: x-access-token:${{ steps.app-token.outputs.token }}@
        run: |
          bash ./scripts/ci/init.sh
          bash ./scripts/ci/build.sh -m
      - name: Compute final build number
        run: |
          echo "COMPUTED_BUILD_NUMBER=$(( $BASE_BUILD_NUMBER + $BUILD_NUMBER ))" >> $GITHUB_ENV
      - name: "Update images"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: mvn -B -V clean install -ntp -DskipTests -Dmaven.javadoc.skip=true -Dbuild-number=${COMPUTED_BUILD_NUMBER} -Pags -Ppush-docker-images,pipeline
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  release:
    name: "Release and Copy to S3 Staging Bucket"
    runs-on: ubuntu-latest
    needs: [docker_latest, commit_parser]
    permissions:
      id-token: write
      contents: read
    if: >
      !(failure() || cancelled()) &&
      contains(needs.commit_parser.outputs.title, '[release]') &&
      github.event_name != 'pull_request'
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          owner: Alfresco
          repositories: alfresco-enterprise-share,alfresco-enterprise-repo,acs-packaging
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: "Create local release branch"
        run: git checkout -B "${{ github.ref_name }}"
      - uses: Alfresco/alfresco-build-tools/.github/actions/env-load-from-yaml@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          yml_path: .github/release-versions.yml
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: "Build"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        env:
          AUTH: x-access-token:${{ steps.app-token.outputs.token }}@
        run: |
          bash ./scripts/ci/init.sh
          bash ./scripts/ci/build.sh -m
      - name: Compute final build number
        run: |
          echo "COMPUTED_BUILD_NUMBER=$(( $BASE_BUILD_NUMBER + $BUILD_NUMBER ))" >> $GITHUB_ENV
      - name: "Verify release version"
        run: bash scripts/ci/verify_release_tag.sh
      - name: "Release"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ env.RELEASE_VERSION }}
          development-version: ${{ env.DEVELOPMENT_VERSION }}
          release-profile: "release,all-tas-tests,pipeline,ags"
          maven-args: "-Darguments=-Prelease,all-tas-tests,pipeline -Pags -DskipTests -Dbuild-number=${{ env.COMPUTED_BUILD_NUMBER }}"
      - name: "Copy share distribution to public Nexus"
        run: |
          source scripts/ci/build_functions.sh
          copyArtifactToAnotherRepo org.alfresco alfresco-content-services-share-distribution \
            "${RELEASE_VERSION}" zip \
            alfresco-enterprise-releases \
            https://nexus.alfresco.com/nexus/content/repositories/releases/
      - name: "Prepare staging artifacts"
        run: bash scripts/ci/prepare_staging_deploy.sh
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh
      - name: "Deploy core distribution to S3 Staging Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          aws-region: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_ROLE_ARN }}
          source: ./deploy_dir
          destination: s3://${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}/alfresco-content-services/release/${{ env.BRANCH_NAME }}/${{ env.COMPUTED_BUILD_NUMBER }}
      - name: "Deploy Share distribution to S3 Staging Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          aws-region: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_ROLE_ARN }}
          source: ./deploy_dir_share
          destination: s3://${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}/share/${{ env.RELEASE_VERSION }}
      - name: "Deploy AGS distribution to S3 Staging Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          aws-region: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_ROLE_ARN }}
          source: ./deploy_dir_ags
          destination: s3://${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}/enterprise/RM/${{ env.RELEASE_VERSION }}
      - name: "Copy Share image to Docker Hub"
        run: bash scripts/ci/copy_share_image_to_docker_hub.sh
      - name: "Print staging deploy summary"
        run: echo "Finished release and deployed to https://s3.console.aws.amazon.com/s3/buckets/${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}/alfresco-content-services/release/${BRANCH_NAME}/${COMPUTED_BUILD_NUMBER}"

  publish:
    name: "Copy to S3 Release Bucket"
    runs-on: ubuntu-latest
    needs: [release, commit_parser]
    permissions:
      id-token: write
      contents: read
    if: >
      !(failure() || cancelled()) &&
      contains(needs.commit_parser.outputs.title, '[publish]') &&
      github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/env-load-from-yaml@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          yml_path: .github/release-versions.yml
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        run: bash ./scripts/ci/init.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      - name: "Rebuild the artifacts and publish them to enterprise-releases"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: bash scripts/ci/maven_publish.sh
      - name: Compute final build number
        run: |
          echo "COMPUTED_BUILD_NUMBER=$(( $BASE_BUILD_NUMBER + $BUILD_NUMBER ))" >> $GITHUB_ENV
      - name: "Compute ACS major version"
        run: echo "ACS_MAJOR_VERSION=${RELEASE_VERSION:0:3}" >> "$GITHUB_ENV"
      - name: "Copy core distribution to S3 Release Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          aws-region: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_ROLE_ARN }}
          source: s3://${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}/alfresco-content-services/release/${{ env.BRANCH_NAME }}/${{ env.COMPUTED_BUILD_NUMBER }}
          destination: s3://${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_BUCKET }}/release/enterprise/ACS/${{ env.ACS_MAJOR_VERSION }}/${{ env.RELEASE_VERSION }}/${{ env.COMPUTED_BUILD_NUMBER }}
          copy-props: none
      - name: "Copy Share distribution to S3 Release Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          aws-region: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_ROLE_ARN }}
          source: s3://${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}/share/${{ env.RELEASE_VERSION }}
          destination: s3://${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_BUCKET }}/release/share/${{ env.RELEASE_VERSION }}
          copy-props: none
      - name: "Copy AGS distribution to S3 Release Bucket"
        uses: Alfresco/alfresco-build-tools/.github/actions/s3-upload@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          aws-region: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_REGION }}
          aws-role-arn: ${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_ROLE_ARN }}
          source: s3://${{ vars.AWS_STAGING_ARTIFACT_UPLOAD_BUCKET }}/enterprise/RM/${{ env.RELEASE_VERSION }}
          destination: s3://${{ vars.AWS_RELEASE_ARTIFACT_UPLOAD_BUCKET }}/release/enterprise/RM/${{ env.RELEASE_VERSION }}
          copy-props: none
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  update_downstream:
    name: "Update acs-community-packaging (after release)"
    runs-on: ubuntu-latest
    needs: [publish, commit_parser]
    if: >
      !(failure() || cancelled()) &&
      (contains(needs.commit_parser.outputs.title, '[downstream]') || (contains(needs.commit_parser.outputs.title, '[release]') &&
      !contains(needs.commit_parser.outputs.title, '[no downstream]'))) &&
      github.event_name != 'pull_request'
    permissions:
      contents: write
      id-token: write
      pull-requests: read   # github-list-pr-authors matches commits to their pull requests
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          owner: Alfresco
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          repositories: |
            acs-packaging
            acs-community-packaging
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/env-load-from-yaml@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          yml_path: .github/release-versions.yml
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          remove-android: 'false'
          remove-tools-cache: 'false'
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/cloudsmith-auth@f3b931eb59ada4485cdf7440ae3c65ce34f0a749 # v19.12.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
      - name: "Init"
        run: bash ./scripts/ci/init.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      - name: "Update downstream"
        id: update-downstream
        run: bash ./scripts/ci/update_downstream.sh
        env:
          COMMIT_MESSAGE: ${{ needs.commit_parser.outputs.title }}
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          AUTH: x-access-token:${{ steps.app-token.outputs.token }}@
      # Authors are everyone merged since the previous release, not just since the last
      # push, because the people behind a release run that failed would go unnamed.
      - name: "Find the previous release"
        id: baseline
        # Names are a nicety; losing them must not stop the release propagating.
        continue-on-error: true
        env:
          VERSION: ${{ steps.update-downstream.outputs.version }}
        run: |
          set -euo pipefail
          # The checkout is shallow, so reach back far enough to see the tag before this one.
          git fetch --deepen=200 --quiet origin
          echo "previous-release=$(git describe --abbrev=0 --tags "$VERSION^")" >> "$GITHUB_OUTPUT"
      # This release reaches acs-community-packaging as one bot commit, so the names travel with it.
      - name: "List who is in this release"
        id: authors
        if: steps.baseline.outputs.previous-release != ''
        continue-on-error: true
        uses: Alfresco/alfresco-build-tools/.github/actions/github-list-pr-authors@74d5f71b8cac71b5c056c8e53d51ba660b0f59fd # v19.14.1
        with:
          from-ref: ${{ steps.baseline.outputs.previous-release }}
          to-ref: ${{ github.sha }}
      # A bump arriving here carries its own authors, and attribution stops if they are dropped.
      - name: "Add the authors this release inherited"
        id: all-authors
        if: steps.baseline.outputs.previous-release != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          FROM_REF: ${{ steps.baseline.outputs.previous-release }}
          TO_REF: ${{ github.sha }}
          OWN: ${{ steps.authors.outputs.cc }}
        run: |
          set -euo pipefail
          INHERITED=$(gh api "repos/$REPOSITORY/compare/$FROM_REF...$TO_REF" \
            --jq '.commits[].commit.message' \
            | sed -n 's/^Authors:[[:space:]]*//p') || INHERITED=""
          ALL=$(printf '%s\n%s\n' "$OWN" "$INHERITED" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' \
            | awk '!seen[$0]++' | paste -sd, -)
          echo "cc=$ALL" >> "$GITHUB_OUTPUT"
      - name: "Compute downstream commit message"
        id: commit-meta
        uses: Alfresco/alfresco-community-repo/.github/actions/get-downstream-commit-message@a78ccb823cee9d0d64f2d76d36fe86d97c9d1b04 # v26.3.0.107
        with:
          commit-title: ${{ needs.commit_parser.outputs.title }}
          version: ${{ steps.update-downstream.outputs.version }}
          # Handles only - this message lands in a repository with a different audience.
          authors: ${{ steps.all-authors.outputs.cc }}
          directives: "[release]"
      - name: "Commit downstream version update"
        uses: iarekylew00t/verified-bot-commit@1ee4374942e5c5f814e9b3121d766cbe45cea360 # v2.3.6
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Alfresco/acs-community-packaging
          ref: ${{ github.ref_name }}
          workspace: ${{ github.workspace }}/../acs-community-packaging
          files: |
            pom.xml
            .github/release-versions.yml
          message: ${{ steps.commit-meta.outputs.message }}
          allow-empty-commit: ${{ steps.commit-meta.outputs.allow-empty-commit }}
          if-no-commit: info
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh
