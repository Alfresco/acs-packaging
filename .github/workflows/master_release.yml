name: Master/Release branch workflow

on:
  push:
    branches:
      - master
      - release/**
      - test/review-and-restrict-global-secrets-test

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  AWS_REGION: eu-west-1
  GITHUB_ACTIONS_DEPLOY_TIMEOUT: 60
  BASE_BUILD_NUMBER: 10000
  # Note: RELEASE_VERSION and DEVELOPMENT_VERSION are now loaded from .github/release-versions.yml

jobs:
  commit_parser:
    name: "Parse commit metadata"
    runs-on: ubuntu-latest
    outputs:
      title: ${{ steps.get-commit.outputs.COMMIT_MESSAGE }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-commit-message@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
        id: get-commit
        with:
          header-only: "true"

  run_ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  docker_latest:
    name: "Update latest and Single Pipeline <acs>-<build> images"
    runs-on: ubuntu-latest
    needs: [run_ci, commit_parser]
    if: >
      !(failure() || cancelled()) &&
      !contains(needs.commit_parser.outputs.title, '[skip docker_latest]') &&
      github.ref_name == 'master' && github.event_name != 'pull_request'
    env:
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          owner: Alfresco
          repositories: alfresco-enterprise-share,alfresco-enterprise-repo,acs-packaging
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: "Build"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        env:
          GIT_USERNAME: ${{ vars.BOT_GITHUB_USERNAME }}
          GIT_PASSWORD: ${{ secrets.BOT_GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          AUTH: x-access-token:${{ steps.app-token.outputs.token }}@
        run: |
          bash ./scripts/ci/init.sh
          bash ./scripts/ci/build.sh -m
      - name: Compute final build number
        run: |
          echo "COMPUTED_BUILD_NUMBER=$(( $BASE_BUILD_NUMBER + $BUILD_NUMBER ))" >> $GITHUB_ENV
      - name: "Update images"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        run: mvn -B -V clean install -ntp -DskipTests -Dmaven.javadoc.skip=true -Dbuild-number=${COMPUTED_BUILD_NUMBER} -Pags -Ppush-docker-images,pipeline
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  release:
    name: "Release and Copy to S3 Staging Bucket"
    runs-on: ubuntu-latest
    needs: [docker_latest, commit_parser]
    if: >
      !(failure() || cancelled()) &&
      contains(needs.commit_parser.outputs.title, '[release]') &&
      github.event_name != 'pull_request'
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      GIT_USERNAME: ${{ vars.BOT_GITHUB_USERNAME }}
      GIT_PASSWORD: ${{ secrets.BOT_GITHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          owner: Alfresco
          repositories: alfresco-enterprise-share,alfresco-enterprise-repo,acs-packaging
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: "Create local release branch"
        run: git checkout -B "${{ github.ref_name }}"
      - uses: Alfresco/alfresco-build-tools/.github/actions/env-load-from-yaml@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
        with:
          yml_path: .github/release-versions.yml
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64
      - name: "Build"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        env:
          AUTH: x-access-token:${{ steps.app-token.outputs.token }}@
        run: |
          bash ./scripts/ci/init.sh
          bash ./scripts/ci/build.sh -m
      - name: Compute final build number
        run: |
          echo "COMPUTED_BUILD_NUMBER=$(( $BASE_BUILD_NUMBER + $BUILD_NUMBER ))" >> $GITHUB_ENV
      - name: "Verify release version"
        run: bash scripts/ci/verify_release_tag.sh
      - name: "Release"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        uses: Alfresco/alfresco-build-tools/.github/actions/maven-release-slim@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-version: ${{ env.RELEASE_VERSION }}
          development-version: ${{ env.DEVELOPMENT_VERSION }}
          release-profile: "release,all-tas-tests,pipeline,ags"
          maven-args: "-Darguments=-Prelease,all-tas-tests,pipeline -Pags -DskipTests -Dbuild-number=${{ env.COMPUTED_BUILD_NUMBER }}"
      - name: "Copy share distribution to public Nexus"
        run: |
          source scripts/ci/build_functions.sh
          copyArtifactToAnotherRepo org.alfresco alfresco-content-services-share-distribution \
            "${RELEASE_VERSION}" zip \
            alfresco-enterprise-releases \
            https://nexus.alfresco.com/nexus/content/repositories/releases/
      - name: "Prepare staging artifacts"
        run: bash scripts/ci/prepare_staging_deploy.sh
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh
      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_STAGING_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_S3_STAGING_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: "Deploy to S3 Staging Bucket"
        run: |
          aws s3 cp --acl private --recursive ./deploy_dir s3://alfresco-artefacts-staging/alfresco-content-services/release/${BRANCH_NAME}/${COMPUTED_BUILD_NUMBER}
          aws s3 cp --acl private --recursive ./deploy_dir_share s3://alfresco-artefacts-staging/share/${RELEASE_VERSION}
          aws s3 cp --acl private --recursive ./deploy_dir_ags s3://alfresco-artefacts-staging/enterprise/RM/${RELEASE_VERSION}

          bash scripts/ci/copy_share_image_to_docker_hub.sh

          echo "Finished release and deployed to https://s3.console.aws.amazon.com/s3/buckets/alfresco-artefacts-staging/alfresco-content-services/release/${BRANCH_NAME}/${COMPUTED_BUILD_NUMBER}"

  publish:
    name: "Copy to S3 Release Bucket"
    runs-on: ubuntu-latest
    needs: [release, commit_parser]
    if: >
      !(failure() || cancelled()) &&
      contains(needs.commit_parser.outputs.title, '[publish]') &&
      github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: Alfresco/alfresco-build-tools/.github/actions/env-load-from-yaml@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
        with:
          yml_path: .github/release-versions.yml
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        run: bash ./scripts/ci/init.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      - name: "Rebuild the artifacts and publish them to enterprise-releases"
        timeout-minutes: ${{ fromJSON(env.GITHUB_ACTIONS_DEPLOY_TIMEOUT) }}
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: bash scripts/ci/maven_publish.sh
      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_RELEASE_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_RELEASE_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Compute final build number
        run: |
          echo "COMPUTED_BUILD_NUMBER=$(( $BASE_BUILD_NUMBER + $BUILD_NUMBER ))" >> $GITHUB_ENV
      - name: "Deploy to S3 Release Bucket"
        run: |
          bash scripts/ci/copy_to_release_bucket.sh $COMPUTED_BUILD_NUMBER
          bash scripts/ci/copy_share_to_release_bucket.sh
          bash scripts/ci/copy_ags_to_release_bucket.sh
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh

  update_downstream:
    name: "Update acs-community-packaging (after release)"
    runs-on: ubuntu-latest
    needs: [publish, commit_parser]
    if: >
      !(failure() || cancelled()) &&
      (contains(needs.commit_parser.outputs.title, '[downstream]') || (contains(needs.commit_parser.outputs.title, '[release]') &&
      !contains(needs.commit_parser.outputs.title, '[no downstream]'))) &&
      github.event_name != 'pull_request'
    env:
      GIT_USERNAME: ${{ vars.BOT_GITHUB_USERNAME }}
    permissions:
      contents: write
    steps:
      - name: "Generate GitHub App token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          owner: Alfresco
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          repositories: |
            acs-packaging
            acs-community-packaging
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: Alfresco/alfresco-build-tools/.github/actions/env-load-from-yaml@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
        with:
          yml_path: .github/release-versions.yml
      - uses: Alfresco/alfresco-build-tools/.github/actions/get-build-info@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/free-hosted-runner-disk-space@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
      - uses: Alfresco/alfresco-build-tools/.github/actions/setup-java-build@30c1953fd4ad6e52062d7eba444298fe1701d1df # v18.22.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: "Init"
        run: bash ./scripts/ci/init.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
      - name: "Update downstream"
        id: update-downstream
        run: bash ./scripts/ci/update_downstream.sh
        env:
          COMMIT_MESSAGE: ${{ needs.commit_parser.outputs.title }}
          MAVEN_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          GIT_PASSWORD: ${{ secrets.BOT_GITHUB_TOKEN }}
          AUTH: x-access-token:${{ steps.app-token.outputs.token }}@
      - name: "Compute downstream commit message"
        id: commit-meta
        uses: Alfresco/alfresco-community-repo/.github/actions/get-downstream-commit-message@f854c1658a59ef8ca6a0f128def983b0ae7dffbe # v26.3.0.22
        with:
          commit-title: ${{ needs.commit_parser.outputs.title }}
          version: ${{ steps.update-downstream.outputs.version }}
          directives: "[release]"
      - name: "Commit downstream version update"
        uses: iarekylew00t/verified-bot-commit@33985d44b7719dcaf0b854a0f4b0caad9bdc5b86 # v2.3.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Alfresco/acs-community-packaging
          ref: ${{ github.ref_name }}
          workspace: ${{ github.workspace }}/../acs-community-packaging
          files: |
            pom.xml
            .github/release-versions.yml
          message: ${{ steps.commit-meta.outputs.message }}
          allow-empty-commit: ${{ steps.commit-meta.outputs.allow-empty-commit }}
          if-no-commit: info
      - name: "Clean Maven cache"
        run: bash ./scripts/ci/cleanup_cache.sh
